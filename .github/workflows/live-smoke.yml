name: Live smoke test
# Checks every live connector against the real services with the repository's secrets (sandbox keys: no real
# bookings, no real charges). Prints PASS / FAIL / SKIP per check; never prints keys. docs/LIVE.md, section 5.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'
  push:
    branches: [live-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/smoke-live.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LITEAPI_API_KEY: ${{ secrets.LITEAPI_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SMOKE_EMAIL_TO: ${{ vars.SMOKE_EMAIL_TO }}
          SMOKE_LITEAPI_PREBOOK: '1'
          SMOKE_LITEAPI_BOOK: '1'
