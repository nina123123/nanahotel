name: Live smoke test
# Checks every live connector against the real services with the repository's secrets
# (sandbox keys: no real bookings, no real charges). Prints PASS / FAIL / SKIP per check; never prints keys.
on:
  workflow_dispatch:
  push:
    branches: [live-smoke]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/smoke-live.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LITEAPI_API_KEY: ${{ secrets.LITEAPI_API_KEY }}
          LITEAPI_PAYMENT_KEY: ${{ secrets.LITEAPI_PAYMENT_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY || secrets.GOOGLE_MAPS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: 'NanaHotel <onboarding@resend.dev>'
          SMOKE_LITEAPI_PREBOOK: '1'
          SMOKE_LITEAPI_BOOK: '1'
  payment-form:
    # LiteAPI's card form end to end in a headless browser (sandbox, Stripe test card; the booking is cancelled).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: node scripts/probe-payment.mjs
        env:
          LITEAPI_API_KEY: ${{ secrets.LITEAPI_API_KEY }}
          LITEAPI_PAYMENT_KEY: ${{ secrets.LITEAPI_PAYMENT_KEY }}
      - name: Keep the pictures (branch probe-shots)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d probe-shots ] || exit 0
          cd probe-shots
          git init -q -b probe-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin probe-shots; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          git commit -qm "Payment probe pictures, run ${GITHUB_RUN_NUMBER}"
          git push -q origin probe-shots
