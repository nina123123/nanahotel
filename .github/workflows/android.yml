name: Android APK
# Builds the Android app and publishes it as a release. With the repository variable NANAHOTEL_SERVER_URL
# (Settings → Secrets and variables → Actions → Variables), the app shows that hosted NanaHotel server, which keeps
# every API key; without it, the app runs its own offline demo. No key is ever built into the APK.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'src/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test the app code
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Bundle the offline demo into the APK
        run: |
          dest=android/app/src/main/assets/web
          mkdir -p "$dest"
          cp -r app public src "$dest"/

      - name: Build APK
        env:
          NANAHOTEL_SERVER_URL: ${{ vars.NANAHOTEL_SERVER_URL }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ vars.NANAHOTEL_SERVER_URL }}
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          apk="nanahotel-${version}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          if [ -n "$SERVER_URL" ]; then
            mode="Connected to the NanaHotel server at ${SERVER_URL}: real hotels and prices, Nana's AI, emails. While the server uses LiteAPI's sandbox, bookings are test bookings and nothing is charged."
          else
            mode="Offline demo: hotels, prices and payments are simulated and Nana's replies are scripted. Nothing is charged."
          fi
          gh release create "android-${GITHUB_RUN_NUMBER}" "$apk" \
            --target "$GITHUB_SHA" \
            --title "NanaHotel for Android ${version}" \
            --notes "On an Android phone, tap ${apk} below to download and install it (the first time, allow your browser to install unknown apps). New versions install over the old one and keep your data. ${mode}"
