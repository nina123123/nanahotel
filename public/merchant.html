<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0c0a">
  <meta name="description" content="NanaHotel for Hotels (demo): today's numbers, rooms and check-in, guest requests, reviews and promotions. The data is simulated and linked to the NanaHotel guest app.">
  <meta name="format-detection" content="telephone=no">
  <title>NanaHotel for Hotels</title>
  <link rel="icon" href="public/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="public/merchant.css">
  <script type="module" src="public/merchant.js"></script>
</head>
<body class="m-body">
  <div class="m-app" id="m-app">
    <header class="m-top">
      <button type="button" class="m-hotel" id="m-hotel" aria-haspopup="dialog">
        <span class="m-hotel-kicker">NanaHotel for Hotels · Demo</span>
        <span class="m-hotel-name" id="m-hotel-name">Loading…</span>
      </button>
      <a class="m-to-guest" id="m-to-guest" href="./">Guest app</a>
    </header>

    <nav class="m-tabs" id="m-tabs" aria-label="Hotel console"></nav>

    <main class="m-main" id="m-main" aria-live="polite"></main>
  </div>

  <div class="m-tip" id="m-tip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">NanaHotel for Hotels needs JavaScript to run.</p></noscript>
</body>
</html>
